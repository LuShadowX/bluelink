<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets artwork reach the edge of a notched screen; the
         stylesheet pays that back with env(safe-area-inset-*) on the chrome. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>BlueLink — Tech, AI, Sports, Games &amp; Lifestyle</title>
    <meta
      name="description"
      content="BlueLink is a calm, well-made reading room for the five things worth keeping up with: technology, artificial intelligence, sport, games and the way we live."
    />

    <!-- Installable app -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#F7F5F0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BlueLink" />
    <!-- "default" keeps dark status-bar text, which is what a paper-white app
         needs; black-translucent would put white glyphs on a light ground. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" href="./favicon-64.png" type="image/png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
