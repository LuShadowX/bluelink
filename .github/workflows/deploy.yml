name: Deploy

on:
  push:
    branches: [main]
  workflow_run:
    # Republish as soon as the cron job lands fresh JSON on the branch.
    workflows: ['Refresh news']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Never cancel a half-finished Pages deployment; queue instead.
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A failed or cancelled refresh must not trigger a deploy.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Turn Pages on if it is not already, so a fresh clone or fork deploys
          # without anyone visiting Settings first.
          enablement: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch feeds
        run: npm run news

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
